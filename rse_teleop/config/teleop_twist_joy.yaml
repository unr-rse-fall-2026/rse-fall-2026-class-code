teleop_node:
  ros__parameters:
    # Common Xbox-style mapping. Verify these indices with /joy before driving.
    axis_linear:
      x: 1
    scale_linear:
      x: 0.40
    scale_linear_turbo:
      x: 0.80

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.00
    scale_angular_turbo:
      yaw: 1.50

    # Hold LB for normal motion or RB for turbo motion.
    enable_button: 4
    enable_turbo_button: 5
    require_enable_button: true
    publish_stamped_twist: false
